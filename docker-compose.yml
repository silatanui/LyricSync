version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - db
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 120 wsgi:app

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lyricsync
      POSTGRES_USER: lyricsync
      POSTGRES_PASSWORD: lyricsync_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
